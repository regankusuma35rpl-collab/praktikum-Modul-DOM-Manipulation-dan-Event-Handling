<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum 1</title>
</head>

<body>
    <h1 id='judul'>Aku Belum Berubah</h1>
    <button id='btnUbah'>Ubah Teks</button>
    <button id='btnWarna'>Ubah Warna</button>
    <button id='btnSizefont'>Ubah Ukuran Font</button>
    <button id='btnReset'>Reset</button>
    <script>
        const judul = document.getElementById('judul');
        const btnUbah = document.getElementById('btnUbah');
        const btnWarna = document.getElementById('btnWarna');
        const btnSizefont = document.getElementById('btnSizefont');
        const btnReset = document.getElementById('btnReset');
        btnUbah.addEventListener('click', () => { judul.textContent = 'Aku Sudah Berubah!'; });
        btnWarna.addEventListener('click', () => { judul.style.color = 'red'; });
        btnSizefont.addEventListener('click', () => { judul.style.fontSize = '50px'; });
        btnReset.addEventListener('click', () => { judul.textContent = 'Aku Kembali'; judul.style.color = 'black'; });
    </script>

</body>

</html>
