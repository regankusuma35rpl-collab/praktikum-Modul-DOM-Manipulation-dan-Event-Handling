<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 50px;}
        #angka { font-size: 64px; }
        button { font-size: 20px; padding: 10px 20px; margin: 5px; }
    </style>
</head>
<body>
    <h1>Counter</h1>
    <div id='angka'>0</div>
    <button id='tambah'>+ Tambah</button>
    <button id='kurang'>- Kurang</button>
    <button id='reset'>Reset</button>

    <script>
        let hitung = 0;
        const angka = document.getElementById('angka');

        document.getElementById('tambah').addEventListener('click', () => {
            hitung = hitung + 1;
            angka.textContent = hitung;

            if (hitung > 0) {
                angka.style.color = 'green';
            } else {
                angka.style.color = 'black';
            }
        });
        document.getElementById('kurang').addEventListener('click', () => {
            hitung = hitung - 1;
            angka.textContent = hitung;

             if (hitung > 0) { 
                hitung = hitung - 1;
            } else if (hitung === 0) {
                angka.style.color = 'red';
            } else { 
                alert("Angka tidak boleh turun di bawah 0!");
            }
            updateTampilan();

        });
        document.getElementById('reset').addEventListener('click', () => {
            hitung = 0;
            angka.textContent = hitung;
        });
    </script>
</body>
</html>
